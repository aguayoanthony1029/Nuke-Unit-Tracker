services:
  - type: web
    name: nuke-community-service
    runtime: docker
    rootDir: community-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_FREE_PICKS_CHANNEL_ID
        sync: false
      - key: DISCORD_TRUSTED_ROLE_ID
        sync: false
      - key: DISCORD_CHANNEL_URL
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_PATH
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.nukesportsbets.nukeunittracker
      - key: APNS_PRODUCTION
        value: "true"

