name: NukeUnitTracker
options:
  bundleIdPrefix: com.nukesportsbets
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  NukeUnitTracker:
    type: application
    platform: iOS
    sources:
      - path: NukeUnitTracker
        excludes:
          - Config
    configFiles:
      Debug: NukeUnitTracker/Config/Debug.xcconfig
      Release: NukeUnitTracker/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nukesportsbets.nukeunittracker
        INFOPLIST_FILE: NukeUnitTracker/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NukeUnitTracker/Resources/NukeUnitTracker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  NukeUnitTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NukeUnitTrackerTests
    dependencies:
      - target: NukeUnitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nukesportsbets.nukeunittracker.tests
        GENERATE_INFOPLIST_FILE: YES
  NukeUnitTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NukeUnitTrackerUITests
    dependencies:
      - target: NukeUnitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nukesportsbets.nukeunittracker.uitests
        GENERATE_INFOPLIST_FILE: YES
